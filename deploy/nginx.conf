server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Container health probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  # Hashed Vite assets: immutable long-term caching.
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  # HTML: never cached.
  location = /index.html {
    access_log off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json;
}
